<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Sign In — Fabric Analyst in a Day | UB Technology Innovations</title>
  <meta name="description" content="Presenter authentication for Fabric Analyst in a Day by UB Technology Innovations Inc.">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <script>
    // If already authenticated in this session, jump directly to dashboard
    if (sessionStorage.getItem('ubti_admin_auth_v1') === 'true') {
      window.location.replace('admin.html');
    }
  </script>

  <style>
    /* Full Page Center Layout */
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      position: relative;
      z-index: 1;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 120, 212, 0.18);
      border-top: 4px solid var(--fabric-teal);
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 48px -10px rgba(0, 120, 212, 0.16), 0 8px 24px -6px rgba(15, 23, 42, 0.08);
      max-width: 440px;
      width: 100%;
      padding: 2.5rem 2.25rem;
      animation: cardEnter 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardEnter {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .shake {
      animation: shakeAnim 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes shakeAnim {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }
  </style>
</head>
<body>

  <!-- Background Watermark Logo -->
  <img src="assets/ubti-logo.svg" alt="UB Technology Innovations Watermark" class="bg-watermark-logo">

  <!-- Ambient Background Gradients -->
  <div class="bg-mesh"></div>
  <div class="bg-grid-pattern"></div>

  <!-- Dedicated Centered Login Container -->
  <main class="login-wrapper">
    <div class="login-card" id="login-card">
      
      <!-- Brand & Header -->
      <div class="text-center mb-4">
        <div style="margin-bottom: 1.25rem;">
          <a href="https://ubtiinc.com/" target="_blank" rel="noopener noreferrer">
            <img src="assets/ubti-logo.png" alt="UB Technology Innovations Inc." style="height: 48px; max-width: 240px; object-fit: contain;">
          </a>
        </div>
        
        <div class="hero-pill-badge mb-2" style="padding: 0.35rem 0.95rem; font-size: 0.8rem;">
          <img src="assets/fabric-icon.svg" width="16" height="16" alt="Fabric" style="vertical-align: middle;">
          <span>Fabric Analyst in a Day</span>
        </div>
        
        <h1 style="font-size: 1.45rem; font-weight: 800; color: #0f172a; margin-top: 0.65rem; margin-bottom: 0.25rem;">
          Presenter Sign In
        </h1>
        <p class="text-muted" style="font-size: 0.85rem; line-height: 1.4;">
          Enter credentials to access live attendee metrics & presentation controls.
        </p>
      </div>

      <!-- Authentication Form -->
      <form id="admin-login-form" novalidate autocomplete="on">
        
        <!-- Username Field -->
        <div class="form-group mb-3">
          <label class="form-label" for="admin-user" style="font-weight: 700; font-size: 0.88rem;">
            <i class="bi bi-person-fill text-teal"></i> Username
          </label>
          <input 
            type="text" 
            id="admin-user" 
            class="form-input" 
            placeholder="ubtiadmin" 
            autocomplete="username" 
            required 
            autofocus
          >
        </div>

        <!-- Password Field -->
        <div class="form-group mb-3">
          <label class="form-label" for="admin-pass" style="font-weight: 700; font-size: 0.88rem;">
            <i class="bi bi-lock-fill text-cyan"></i> Password
          </label>
          <div style="position: relative;">
            <input 
              type="password" 
              id="admin-pass" 
              class="form-input" 
              placeholder="••••••••••••" 
              autocomplete="current-password" 
              required 
              style="padding-right: 2.75rem;"
            >
            <button 
              type="button" 
              id="btn-toggle-pass" 
              aria-label="Toggle password visibility" 
              style="position: absolute; right: 0.85rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.15rem; padding: 0;"
            >
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <!-- Error Feedback Banner -->
        <div 
          id="admin-login-error" 
          class="d-none" 
          style="background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; border-radius: var(--radius-sm); padding: 0.65rem 0.85rem; font-size: 0.85rem; margin-bottom: 1.15rem; display: flex; align-items: center; gap: 0.5rem;"
        >
          <i class="bi bi-exclamation-triangle-fill"></i>
          <span id="admin-login-error-text">Invalid username or password.</span>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary btn-lg" id="btn-admin-submit" style="width: 100%;">
          <span>Sign In to Admin Console</span>
          <i class="bi bi-box-arrow-in-right"></i>
        </button>

        <!-- Auxiliary Navigation -->
        <div class="text-center mt-3">
          <a href="index.html" class="text-muted" style="font-size: 0.82rem; text-decoration: none;">
            <i class="bi bi-arrow-left"></i> Return to Participant Quiz
          </a>
        </div>
      </form>
    </div>

    <!-- Page Footer Note -->
    <div class="text-center mt-4" style="color: #64748b; font-size: 0.78rem;">
      &copy; 2026 <a href="https://ubtiinc.com/" target="_blank" rel="noopener noreferrer" style="color: inherit; text-decoration: none; font-weight: 600;">UB Technology Innovations Inc.</a> All rights reserved.
    </div>
  </main>

  <!-- Login Logic Script -->
  <script>
    (function() {
      const AUTH_KEY = 'ubti_admin_auth_v1';
      const VALID_USER = 'ubtiadmin';
      const VALID_PASS = 'FAIAD@2026';

      const loginForm = document.getElementById('admin-login-form');
      const userInput = document.getElementById('admin-user');
      const passInput = document.getElementById('admin-pass');
      const loginError = document.getElementById('admin-login-error');
      const loginErrorText = document.getElementById('admin-login-error-text');
      const togglePassBtn = document.getElementById('btn-toggle-pass');
      const loginCard = document.getElementById('login-card');
      const submitBtn = document.getElementById('btn-admin-submit');

      // Password visibility toggle
      if (togglePassBtn && passInput) {
        togglePassBtn.addEventListener('click', function() {
          const isPass = passInput.type === 'password';
          passInput.type = isPass ? 'text' : 'password';
          togglePassBtn.innerHTML = isPass ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
        });
      }

      // Handle Submit
      if (loginForm) {
        loginForm.addEventListener('submit', function(e) {
          e.preventDefault();
          const u = (userInput ? userInput.value : '').trim();
          const p = (passInput ? passInput.value : '').trim();

          if (u === VALID_USER && p === VALID_PASS) {
            if (loginError) loginError.classList.add('d-none');
            sessionStorage.setItem(AUTH_KEY, 'true');

            // Visual feedback before transition
            if (submitBtn) {
              submitBtn.innerHTML = '<span>Verifying...</span> <i class="bi bi-check-circle-fill"></i>';
              submitBtn.disabled = true;
            }

            setTimeout(function() {
              window.location.replace('admin.html');
            }, 300);
          } else {
            if (loginError) {
              loginError.classList.remove('d-none');
              if (loginErrorText) {
                loginErrorText.textContent = 'Invalid username or password. Please verify credentials.';
              }
            }

            // Trigger shake animation
            if (loginCard) {
              loginCard.classList.remove('shake');
              void loginCard.offsetWidth; // force reflow
              loginCard.classList.add('shake');
            }

            if (passInput) {
              passInput.value = '';
              passInput.focus();
            }
          }
        });
      }
    })();
  </script>
</body>
</html>
